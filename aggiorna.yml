name: Aggiorna liturgia

on:
  schedule:
    # ogni giorno alle 02:17 UTC (03:17/04:17 in Italia) – scarica oggi + 7 giorni
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Data singola AAAAMMGG (vuoto = oggi + 7 giorni)"
        required: false

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scarica antifona, salmo e vangelo
        run: node scripts/aggiorna.mjs ${{ github.event.inputs.data }}
      - name: Salva i file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Liturgia aggiornata $(date -u +%Y-%m-%d)" && git push)
